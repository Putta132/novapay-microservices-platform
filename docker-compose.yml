version: '3.8'

services:
  # ––– Database –––––––––––––––––––––––––––––––––––––––––
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: novapay
      POSTGRES_PASSWORD: novapay_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapay"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ––– Redis (cache) ––––––––––––––––––––––––––––––––––––
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ––– Zookeeper (for Kafka) ––––––––––––––––––––––––––––
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ––– Kafka (message broker) –––––––––––––––––––––––––––
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ––– auth-service –––––––––––––––––––––––––––––––––––––
  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_URL: postgresql://novapay:novapay_dev_pass@postgres:5432/authdb
      REDIS_HOST: redis
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ––– account-service ––––––––––––––––––––––––––––––––––
  account-service:
    build: ./services/account-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_URL: postgresql://novapay:novapay_dev_pass@postgres:5432/accountdb
      REDIS_HOST: redis
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ––– gateway-service ––––––––––––––––––––––––––––––––––
  gateway-service:
    build: ./services/gateway-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
      ACCOUNT_SERVICE_URL: http://account-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3004
      TRANSACTION_SERVICE_URL: http://transaction-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      REDIS_HOST: redis
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_started}
      account-service: {condition: service_started}

  # ––– payment-service ––––––––––––––––––––––––––––––––––
  payment-service:
    build: ./services/payment-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_URL: postgresql://novapay:novapay_dev_pass@postgres:5432/paymentdb
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}

  # ––– transaction-service –––––––––––––––––––––––––––––
  transaction-service:
    build: ./services/transaction-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_URL: postgresql://novapay:novapay_dev_pass@postgres:5432/transactiondb
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  # ––– notification-service ––––––––––––––––––––––––––––
  notification-service:
    build: ./services/notification-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_URL: postgresql://novapay:novapay_dev_pass@postgres:5432/notificationdb
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  # ––– frontend-service –––––––––––––––––––––––––––––––––
  frontend-service:
    build: ./services/frontend-service
    ports:
      - "80:80"
    environment:
      GATEWAY_URL: http://localhost:3002
    depends_on:
      gateway-service: {condition: service_started}

volumes:
  pgdata: